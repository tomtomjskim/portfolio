name: Validate portfolio source

on:
  push:
    branches: [main, portfolio/source-hardening-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Validate manifest, Case contract, links, and public boundary
        run: python3 scripts/validate_portfolio.py
